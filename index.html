<!DOCTYPE html>
<html lang="en">
  <head>
  <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
    <title>Piano</title>
  </head>
  <body>
    <div class="piano">
      <div class="key white" data-note="C"></div>
      <div class="key black" data-note="Db"></div>
      <div class="key white" data-note="D"></div>
      <div class="key black" data-note="Eb"></div>
      <div class="key white" data-note="E"></div>
      <div class="key white" data-note="F"></div>
      <div class="key black" data-note="Gb"></div>
      <div class="key white" data-note="G"></div>
      <div class="key black" data-note="Ab"></div>
      <div class="key white" data-note="A"></div>
      <div class="key black" data-note="Bb"></div>
      <div class="key white" data-note="B"></div>
    </div>

    <!-- Load Audio Files -->
    <audio id="C" src="Piano Notes/C.mp3"></audio>
    <audio id="Db" src="Piano Notes/Db.mp3"></audio>
    <audio id="D" src="Piano Notes/D.mp3"></audio>
    <audio id="Eb" src="Piano Notes/Eb.mp3"></audio>
    <audio id="E" src="Piano Notes/E.mp3"></audio>
    <audio id="F" src="Piano Notes/F.mp3"></audio>
    <audio id="Gb" src="Piano Notes/Gb.mp3"></audio>
    <audio id="G" src="Piano Notes/G.mp3"></audio>
    <audio id="Ab" src="Piano Notes/Ab.mp3"></audio>
    <audio id="A" src="Piano Notes/A.mp3"></audio>
    <audio id="Bb" src="Piano Notes/Bb.mp3"></audio>
    <audio id="B" src="Piano Notes/B.mp3"></audio>
  <script src="script.js"></script>
</html>
